# Data source config template
# sources:
#   - name: # Data source name
#     url: # Data source URL
#     type: # Type (rss/json/api)
#     parser: # Parser to use
#     interval: # Collection interval (seconds)
#     enabled: # Whether enabled
#   - name: # Another data source
#     url:
#     type:
#     parser:
sources:

  - id: sec_press
    type: rss
    url: "https://www.sec.gov/news/pressreleases.rss"
    interval_sec: 60
    parser: rss_default
    enabled: true
    max_age_hours: 48
    bootstrap_latest_only: true
    bootstrap_keep_n: 3

  - id: fed_press
    type: rss
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    interval_sec: 60
    parser: rss_default
    enabled: true
    max_age_hours: 48
    bootstrap_latest_only: true
    bootstrap_keep_n: 3

  

  - id: ars_tech
    type: rss
    url: "https://feeds.arstechnica.com/arstechnica/technology"
    interval_sec: 45
    parser: rss_default
    enabled: false        # Recommended off for now; can be enabled if desired
    max_age_hours: 24
    bootstrap_latest_only: true
    bootstrap_keep_n: 2


